
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ВЛ · Справочник прокачки</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mio.css">
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="theme.css?v=1.15">
  <link rel="stylesheet" href="compare.css?v=1.16">
  <link rel="stylesheet" href="talents.css?v=1.09">
  <script defer src="data.js"></script>
  <script defer src="equipment.js"></script>
  <script defer src="equipment-icons.js"></script>
  <script defer src="duel-weapon-data.js?v=1.16"></script>
  <script defer src="duel.js?v=1.16"></script>
  <script defer src="compare.js?v=1.16"></script>
  <script defer src="talents-data.js?v=1.04"></script>
  <script defer src="talents.js?v=1.09"></script>
  <script defer src="app.js?v=1.16"></script>
</head>
<body>
  <header class="topbar">
    <button type="button" class="mobile-menu-toggle" id="catalog-toggle" aria-label="Открыть каталог" aria-controls="catalog-sidebar" aria-expanded="false"><img src="assets/icon_mobile_menu.png" alt="" aria-hidden="true"></button>
    <a class="brand" href="#" aria-label="War Legends — на главную"><img class="brand-logo" src="assets/war_legends_logo.png" alt="War Legends"></a>
    <nav class="modes" aria-label="Раздел сайта"><button type="button" class="mode active" data-mode="upgrade" aria-pressed="true"><img src="assets/nav_upgrade_book.png" alt="" aria-hidden="true">Прокачка</button><button type="button" class="mode" data-mode="equipment" aria-pressed="false"><img src="assets/nav_equipment_backpack.png" alt="" aria-hidden="true">Экипировка</button><button type="button" class="mode" data-mode="compare" aria-pressed="false"><img src="assets/icon_deltafield_dmg.png" alt="" aria-hidden="true"><span>Конструктор<br>шмота</span></button><button type="button" class="mode" data-mode="talents" aria-pressed="false"><img src="assets/icon_talents.png" alt="" aria-hidden="true">Таланты</button></nav>
  </header>
  <main class="layout">
    <button type="button" class="menu-backdrop" id="catalog-backdrop" aria-label="Закрыть каталог" tabindex="-1" hidden></button>
    <aside class="sidebar" id="catalog-sidebar" aria-label="Каталог">
      <div class="sidebar-head"><div><span class="eyebrow">СПРАВОЧНИК</span></div><span id="count" class="count" aria-label="Найдено записей"></span><button type="button" class="mobile-menu-close" id="catalog-close" aria-label="Закрыть каталог">×</button></div>
      <div class="search"><span aria-hidden="true">⌕</span><label class="sr-only" for="search">Поиск в выбранной категории</label><input id="search" type="search" placeholder="Поиск в категории" autocomplete="off"><button type="button" id="clear-search" aria-label="Очистить поиск" hidden>×</button></div>
      <div class="tabs" role="group" aria-label="Категория"><button type="button" data-type="3" class="active" aria-pressed="true"><img src="assets/category_heroes.png" alt="" aria-hidden="true">Герои</button><button type="button" data-type="1" aria-pressed="false"><img src="assets/category_troops.png" alt="" aria-hidden="true">Армия</button><button type="button" data-type="2" aria-pressed="false"><img src="assets/category_buildings.png" alt="" aria-hidden="true">Здания</button><button type="button" data-type="4" aria-pressed="false"><img src="assets/category_scrolls.png" alt="" aria-hidden="true">Свитки</button></div>
      <div id="list" class="entity-list"></div>
      <div class="sidebar-animation" aria-hidden="true"><img src="assets/ayaya-march.gif" alt=""></div>
    </aside>
    <div class="content-column">
      <span id="selection-status" class="sr-only" role="status" aria-live="polite"></span>
      <section class="main-content" id="content" aria-label="Выбранная запись"></section>
    </div>
  </main>
</body>
</html>
